name: "install uv"
description: "installs uv using the community action"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 #v10.3.3
      with:
        version: '0.12.23'

    - run: uv sync --locked --all-extras --dev
      shell: bash

    - run: uv run which pyright
      shell: bash